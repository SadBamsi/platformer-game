<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="256" height="256" shape-rendering="crispEdges">
  <!-- Фонавая аснова зямлі (цёмна-карычневая) -->
  <rect x="0" y="0" width="16" height="16" fill="#573810"/>

  <!-- Асноўны светла-карычневы колер зямлі -->
  <path d="
    M 0,4 H 16 V 16 H 0 Z
  " fill="#8B5A2B"/>

  <!-- Цёмныя дэталі/цені зямлі (піксельны ўзор) -->
  <path d="
    M 1,6 H 3 V 7 H 1 Z
    M 6,7 H 8 V 8 H 6 Z
    M 12,6 H 14 V 7 H 12 Z
    M 3,10 H 5 V 11 H 3 Z
    M 9,11 H 11 V 12 H 9 Z
    M 14,10 H 15 V 11 H 14 Z
    M 1,14 H 2 V 15 H 1 Z
    M 7,14 H 9 V 15 H 7 Z
    M 13,13 H 15 V 14 H 13 Z
  " fill="#573810"/>

  <!-- Светлыя асновы/акцэнты на зямлі -->
  <path d="
    M 3,6 H 4 V 7 H 3 Z
    M 8,7 H 9 V 8 H 8 Z
    M 5,10 H 6 V 11 H 5 Z
    M 11,11 H 12 V 12 H 11 Z
    M 9,14 H 10 V 15 H 9 Z
  " fill="#A06832"/>

  <!-- Цёмны контур і цень пад травой (цёмна-зялёны) -->
  <path d="
    M 0,0 H 16 V 5 H 0 Z
  " fill="#005200"/>

  <!-- Асноўны яскравы зялёны колер травы -->
  <path d="
    M 0,0 H 16 V 3 H 0 Z
    M 1,3 H 3 V 4 H 1 Z
    M 5,3 H 7 V 4 H 5 Z
    M 9,3 H 11 V 4 H 9 Z
    M 13,3 H 15 V 4 H 13 Z
  " fill="#00A800"/>

  <!-- Светла-зялёны блик / верхняя крайка травы (Mario-style highlight) -->
  <path d="
    M 0,0 H 16 V 1 H 0 Z
    M 1,1 H 3 V 2 H 1 Z
    M 5,1 H 7 V 2 H 5 Z
    M 9,1 H 11 V 2 H 9 Z
    M 13,1 H 15 V 2 H 13 Z
  " fill="#5CDB5C"/>

  <!-- Белыя кропкавыя бликі (для стылю Марыё) -->
  <path d="
    M 1,0 H 2 V 1 H 1 Z
    M 5,0 H 6 V 1 H 5 Z
    M 9,0 H 10 V 1 H 9 Z
    M 13,0 H 14 V 1 H 13 Z
  " fill="#FFFFFF"/>
</svg>

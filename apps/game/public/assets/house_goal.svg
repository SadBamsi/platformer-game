  <rect x="14" y="19" width="4" height="3" fill="#FFFFFF" />
  <rect x="15" y="20" width="1" height="1" fill="#FFD043" />
  <rect x="16" y="20" width="1" height="1" fill="#FFD043" />

  <!-- Door Frame & Door -->
  <rect x="13" y="22" width="6" height="5" fill="#FFFFFF" />
  <rect x="14" y="23" width="4" height="4" fill="#522E15" />
  <rect x="15" y="23" width="2" height="4" fill="#3D210D" />
  <rect x="17" y="25" width="1" height="1" fill="#FFD043" />

